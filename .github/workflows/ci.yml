name: ci

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    ci:
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v6
            - uses: mlugg/setup-zig@v2
              with:
                  version: 0.16.0
            - run: zig build ci --summary all
